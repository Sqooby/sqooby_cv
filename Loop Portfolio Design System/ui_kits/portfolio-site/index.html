<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Loop — one-page portfolio</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="./data.js"></script>
</head>
<body><div id="root"></div>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./WorkGrid.jsx"></script>
<script type="text/babel" src="./About.jsx"></script>
<script type="text/babel" src="./ContactSection.jsx"></script>
<script type="text/babel" src="./CaseStudy.jsx"></script>
<script type="text/babel" data-presets="react">
(function(){
const { NavBar, Footer, Marquee } = window.LoopPortfolioDesignSystem_41f2ca;
const { projects, filters } = window.LOOP_DATA;

function App() {
  const [view, setView] = React.useState({ page:'home' });
  const [filter, setFilter] = React.useState('All work');
  const [section, setSection] = React.useState('work');
  React.useEffect(() => { window.scrollTo(0, 0); }, [view]);
  const open = (id) => setView({ page:'case', id });
  const go = (id) => {
    setSection(id);
    if (view.page !== 'home') { setView({ page:'home' }); return; }
    const el = document.getElementById(id);
    if (el) window.scrollTo({ top: el.offsetTop - 96, behavior:'smooth' });
  };
  const project = view.page === 'case' ? projects.find(p => p.id === view.id) : null;
  const next = project ? projects[(projects.indexOf(project) + 1) % projects.length] : null;
  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <NavBar brand="Loop" activeItem={section} onNavigate={go} cta="Hire me" onCta={() => go('contact')}
        items={[{ id:'work', label:'Work' }, { id:'about', label:'About' }, { id:'contact', label:'Contact' }]} />
      <main style={{ flex:1 }}>
        {project
          ? <CaseStudy project={project} next={next} onBack={() => setView({ page:'home' })} onOpen={open} />
          : <>
              <Hero onCta={() => go('work')} />
              <Marquee items={['Brand systems','Product design','3D & motion','Design systems','Art direction']} />
              <WorkGrid projects={projects} filters={filters} filter={filter} onFilter={setFilter} onOpen={open} />
              <About />
              <ContactSection />
            </>}
      </main>
      <Footer brand="Loop" tagline="Independent design studio — Kraków, remote everywhere."
        links={[{ label:'Work' }, { label:'About' }, { label:'Resume' }, { label:'Letter' }]}
        socials={[{ label:'X', icon:'twitter' }, { label:'GitHub', icon:'github' }, { label:'Dribbble', icon:'dribbble' }, { label:'Email', icon:'mail' }]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
