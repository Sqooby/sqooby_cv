<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:var(--outline-ink);border-radius:var(--radius-sm)}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:20px"><div class="sw"><div style="width:110px;height:78px;background:var(--paper-000);border:var(--outline-ink);border-radius:var(--radius-md);box-shadow:var(--shadow-sticker-sm)"></div><span class="lab">sticker-sm</span></div><div class="sw"><div style="width:110px;height:78px;background:var(--paper-000);border:var(--outline-ink);border-radius:var(--radius-md);box-shadow:var(--shadow-sticker)"></div><span class="lab">sticker</span></div><div class="sw"><div style="width:110px;height:78px;background:var(--paper-000);border:var(--outline-ink);border-radius:var(--radius-md);box-shadow:var(--shadow-sticker-lg)"></div><span class="lab">sticker-lg</span></div><div class="sw"><div style="width:110px;height:78px;background:var(--paper-000);border:none;border-radius:var(--radius-md);box-shadow:var(--shadow-soft)"></div><span class="lab">soft</span></div><div class="sw"><div style="width:110px;height:78px;background:var(--paper-000);border:none;border-radius:var(--radius-md);box-shadow:var(--shadow-soft-lg)"></div><span class="lab">soft-lg</span></div></div></body></html>
