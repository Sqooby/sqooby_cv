<!-- @dsCard group="Colors" viewport="700x170" name="Semantic roles" subtitle="What to reach for instead of a raw ramp value" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:var(--outline-ink);border-radius:var(--radius-sm)}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="width:84px;background:var(--bg-page)"></div><span class="lab">page<br>--bg-page</span></div><div class="sw"><div class="chip" style="width:84px;background:var(--bg-surface)"></div><span class="lab">surface<br>--bg-surface</span></div><div class="sw"><div class="chip" style="width:84px;background:var(--bg-inverse)"></div><span class="lab">inverse<br>--bg-inverse</span></div><div class="sw"><div class="chip" style="width:84px;background:var(--accent)"></div><span class="lab">accent<br>--accent</span></div><div class="sw"><div class="chip" style="width:84px;background:var(--accent-soft)"></div><span class="lab">accent soft<br>--accent-soft</span></div><div class="sw"><div class="chip" style="width:84px;background:var(--bg-tint-cool)"></div><span class="lab">tint cool<br>--bg-tint-cool</span></div><div class="sw"><div class="chip" style="width:84px;background:var(--bg-tint-warm)"></div><span class="lab">tint warm<br>--bg-tint-warm</span></div></div></body></html>
