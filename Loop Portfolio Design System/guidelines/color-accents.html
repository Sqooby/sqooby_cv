<!-- @dsCard group="Colors" viewport="700x300" name="Candy accents" subtitle="Flat 500/300/100 steps — always paired with an ink outline" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:var(--outline-ink);border-radius:var(--radius-sm)}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px"><div class="sw"><div class="chip" style="background:var(--blue-500)"></div><div class="chip" style="background:var(--blue-300)"></div><div class="chip" style="background:var(--blue-100)"></div><span class="lab">blue<br>500 / 300 / 100</span></div><div class="sw"><div class="chip" style="background:var(--mint-500)"></div><div class="chip" style="background:var(--mint-300)"></div><div class="chip" style="background:var(--mint-100)"></div><span class="lab">mint<br>500 / 300 / 100</span></div><div class="sw"><div class="chip" style="background:var(--lilac-500)"></div><div class="chip" style="background:var(--lilac-300)"></div><div class="chip" style="background:var(--lilac-100)"></div><span class="lab">lilac<br>500 / 300 / 100</span></div><div class="sw"><div class="chip" style="background:var(--blush-500)"></div><div class="chip" style="background:var(--blush-300)"></div><div class="chip" style="background:var(--blush-100)"></div><span class="lab">blush<br>500 / 300 / 100</span></div><div class="sw"><div class="chip" style="background:var(--butter-500)"></div><div class="chip" style="background:var(--butter-300)"></div><div class="chip" style="background:var(--butter-100)"></div><span class="lab">butter<br>500 / 300 / 100</span></div><div class="sw"><div class="chip" style="background:var(--clay-500)"></div><div class="chip" style="background:var(--clay-300)"></div><div class="chip" style="background:var(--clay-100)"></div><span class="lab">clay<br>500 / 300 / 100</span></div></div></body></html>
