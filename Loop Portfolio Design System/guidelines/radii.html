<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:var(--outline-ink);border-radius:var(--radius-sm)}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div style="width:82px;height:66px;border:var(--outline-ink);border-radius:var(--radius-xs);background:var(--blue-100)"></div><span class="lab">xs · 6px</span></div><div class="sw"><div style="width:82px;height:66px;border:var(--outline-ink);border-radius:var(--radius-sm);background:var(--blue-100)"></div><span class="lab">sm · 10px</span></div><div class="sw"><div style="width:82px;height:66px;border:var(--outline-ink);border-radius:var(--radius-md);background:var(--blue-100)"></div><span class="lab">md · 16px</span></div><div class="sw"><div style="width:82px;height:66px;border:var(--outline-ink);border-radius:var(--radius-lg);background:var(--blue-100)"></div><span class="lab">lg · 24px</span></div><div class="sw"><div style="width:82px;height:66px;border:var(--outline-ink);border-radius:var(--radius-xl);background:var(--blue-100)"></div><span class="lab">xl · 36px</span></div><div class="sw"><div style="width:82px;height:66px;border:var(--outline-ink);border-radius:var(--radius-2xl);background:var(--blue-100)"></div><span class="lab">2xl · 48px</span></div><div class="sw"><div style="width:82px;height:66px;border:var(--outline-ink);border-radius:var(--radius-pill);background:var(--blue-100)"></div><span class="lab">pill · 999px</span></div></div></body></html>
