<!-- @dsCard group="Brand" viewport="700x230" name="Card anatomy" subtitle="2px ink border + 4px offset shadow + 24px radius" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:var(--outline-ink);border-radius:var(--radius-sm)}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row" style="gap:18px">
<div style="width:200px;padding:20px;background:var(--paper-000);border:var(--outline-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-sticker)"><span class="lab">default</span><h3 style="font-size:20px;margin-top:6px">Paper card</h3></div>
<div style="width:200px;padding:20px;background:var(--mint-100);border:var(--outline-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-sticker)"><span class="lab">tinted</span><h3 style="font-size:20px;margin-top:6px">Mint card</h3></div>
<div style="width:200px;padding:20px;background:var(--ink-900);color:var(--paper-000);border:var(--outline-ink);border-radius:var(--radius-lg);box-shadow:var(--shadow-sticker)"><span class="lab" style="color:var(--paper-400)">inverse</span><h3 style="font-size:20px;margin-top:6px">Ink card</h3></div></div></body></html>
