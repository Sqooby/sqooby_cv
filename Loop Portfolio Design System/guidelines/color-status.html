<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Positive, warning, critical, info" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:var(--outline-ink);border-radius:var(--radius-sm)}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="width:140px;background:var(--status-positive)"></div><span class="lab">positive<br>--status-positive</span></div><div class="sw"><div class="chip" style="width:140px;background:var(--status-warning)"></div><span class="lab">warning<br>--status-warning</span></div><div class="sw"><div class="chip" style="width:140px;background:var(--status-critical)"></div><span class="lab">critical<br>--status-critical</span></div><div class="sw"><div class="chip" style="width:140px;background:var(--status-info)"></div><span class="lab">info<br>--status-info</span></div></div></body></html>
