<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:var(--outline-ink);border-radius:var(--radius-sm)}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="width:116px;background:var(--paper-000)"></div><span class="lab">000<br>--paper-000</span></div><div class="sw"><div class="chip" style="width:116px;background:var(--paper-100)"></div><span class="lab">100<br>--paper-100</span></div><div class="sw"><div class="chip" style="width:116px;background:var(--paper-200)"></div><span class="lab">200<br>--paper-200</span></div><div class="sw"><div class="chip" style="width:116px;background:var(--paper-300)"></div><span class="lab">300<br>--paper-300</span></div><div class="sw"><div class="chip" style="width:116px;background:var(--paper-400)"></div><span class="lab">400<br>--paper-400</span></div></div></body></html>
