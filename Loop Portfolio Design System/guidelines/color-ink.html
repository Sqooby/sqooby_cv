<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-page);overflow:hidden}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border:var(--outline-ink);border-radius:var(--radius-sm)}.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="width:96px;background:var(--ink-900)"></div><span class="lab">900<br>--ink-900</span></div><div class="sw"><div class="chip" style="width:96px;background:var(--ink-700)"></div><span class="lab">700<br>--ink-700</span></div><div class="sw"><div class="chip" style="width:96px;background:var(--ink-500)"></div><span class="lab">500<br>--ink-500</span></div><div class="sw"><div class="chip" style="width:96px;background:var(--ink-300)"></div><span class="lab">300<br>--ink-300</span></div><div class="sw"><div class="chip" style="width:96px;background:var(--ink-200)"></div><span class="lab">200<br>--ink-200</span></div><div class="sw"><div class="chip" style="width:96px;background:var(--ink-100)"></div><span class="lab">100<br>--ink-100</span></div></div></body></html>
